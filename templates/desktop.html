<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LocalCue</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: #0d0d1a;
      color: #eee;
      font-family: sans-serif;
    }

    #controls {
      display: flex;
      align-items: center;
      flex-wrap: wrap;           /* a second row on narrower windows, rather than clipping */
      gap: 6px 14px;
      padding: 6px 16px;
      min-height: 52px;
      background: #1a1a2e;
      flex-shrink: 0;
      border-bottom: 1px solid #2a2a4a;
    }

    #controls button {
      background: #2a2a4e;
      color: #eee;
      border: 1px solid #44448a;
      border-radius: 4px;
      padding: 4px 10px;
      cursor: pointer;
      font-size: 14px;
      white-space: nowrap;
    }
    #controls button:hover { background: #3a3a6e; }
    #controls button[hidden] { display: none; }

    #file-status {
      font-size: 11px;
      color: #888;
      white-space: nowrap;
      max-width: 160px;
      flex-shrink: 0;   /* otherwise the crowded control bar squeezes it to nothing */
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #file-status.dirty { color: #fa4; }
    #file-status.error { color: #f66; }
    #controls button.active { background: #4a4a9e; border-color: #8888ff; }

    .ctrl-sep {
      width: 1px;
      height: 28px;
      background: #2a2a4a;
      flex-shrink: 0;
    }

    /* Slider control group: label on top, slider + value on bottom */
    .slider-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
    }
    .slider-group label {
      font-size: 10px;
      color: #888;
      white-space: nowrap;
      line-height: 1;
    }
    .slider-row {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .slider-row input[type=range] {
      width: 80px;
      accent-color: #6666cc;
      cursor: pointer;
    }
    .slider-val {
      font-size: 11px;
      color: #aaa;
      min-width: 32px;
      text-align: left;
    }

    .section-label {
      font-size: 12px;
      color: #888;
      white-space: nowrap;
    }

    #qr-btn { font-size: 15px; padding: 4px 14px; }

    #scroll-display {
      margin-left: auto;
      font-size: 12px;
      color: #777;
      white-space: nowrap;
      flex-shrink: 0;
    }

    #play-status {
      font-size: 11px;
      white-space: nowrap;
      min-width: 52px;
    }
    #play-status.playing { color: #6f6; }
    #play-status.paused  { color: #fa4; }

    /* What voice-follow is hearing (newest words at the right) */
    #voice-status {
      font-size: 11px;
      color: #8a8;
      white-space: nowrap;
      overflow: hidden;
      direction: rtl;            /* clip the oldest words (left), keep the newest visible */
      text-overflow: ellipsis;
      width: 180px;
      flex-shrink: 0;
    }
    #voice-status.error { color: #f66; direction: ltr; }

    #editor {
      flex: 1;
      min-height: 0;
      position: relative;
      display: flex;
    }

    /* Reading line: positioned by JS, one third of the way down the editor */
    #reading-line {
      position: absolute;
      left: 0;
      right: 0;
      height: 1px;
      background: rgba(255, 70, 70, 0.6);
      pointer-events: none;
    }

    /* Hidden copy of the editor text, used to measure where characters wrap */
    #mirror {
      position: absolute;
      top: 0;
      left: -10000px;
      visibility: hidden;
      white-space: pre-wrap;
      overflow-wrap: break-word;
    }

    #script {
      flex: 1;
      resize: none;
      padding: 20px 24px;
      font-size: 18px;
      font-family: Georgia, serif;
      line-height: 1.7;
      background: #0d0d1a;
      color: #e0e0e8;
      border: none;
      outline: none;
      overflow: auto;
    }

    /* QR overlay */
    #qr-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    #qr-overlay[hidden] { display: none; }

    #qr-popup {
      background: #fff;
      color: #111;
      border-radius: 10px;
      padding: 28px 32px;
      text-align: center;
      max-width: 320px;
    }
    #qr-popup p {
      font-size: 13px;
      word-break: break-all;
      margin-bottom: 14px;
      color: #333;
    }
    #qr-popup img { display: block; margin: 0 auto 16px; max-width: 220px; }
    #qr-popup button {
      background: #1a1a2e;
      color: #eee;
      border: none;
      border-radius: 4px;
      padding: 6px 20px;
      cursor: pointer;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div id="controls">
    <button id="qr-btn">&#x1F4F1; QR Code</button>
    <!-- Save: only shown when a script file was given on the command line -->
    <button id="save-btn" title="Save script back to disk (Ctrl+S)" hidden>&#x1F4BE; Save</button>
    <button id="reload-btn" title="Reload script from disk (discards unsaved edits)" hidden>&#x27F3; Reload</button>
    <span id="file-status"></span>

    <div class="ctrl-sep"></div>
    <span class="section-label">Mobile text controls:</span>

    <!-- Font size slider -->
    <div class="slider-group">
      <label for="font-slider">Font size</label>
      <div class="slider-row">
        <input type="range" id="font-slider" min="16" max="96" step="4" value="36">
        <span class="slider-val" id="font-display">36px</span>
      </div>
    </div>

    <!-- Side margin slider: icon shows text block between two vertical bars -->
    <div class="slider-group">
      <label for="margin-slider">| side margins |</label>
      <div class="slider-row">
        <input type="range" id="margin-slider" min="0" max="40" step="1" value="15">
        <span class="slider-val" id="margin-display">15%</span>
      </div>
    </div>

    <!-- Flip button -->
    <button id="flip-btn" class="active" title="Toggle left-right mirror on mobile">&#8596; Flip</button>

    <!-- Brightness slider -->
    <div class="slider-group">
      <label for="bright-slider">&#9728;&#xFE0E; Brightness</label>
      <div class="slider-row">
        <input type="range" id="bright-slider" min="0" max="100" step="1" value="25">
        <span class="slider-val" id="bright-display">25%</span>
      </div>
    </div>

    <div class="ctrl-sep"></div>

    <!-- Play Mode -->
    <button id="play-mode-btn" title="Toggle play mode — arrow keys control scrolling">&#9654; Play</button>

    <!-- Speed slider (visible in play mode, but always present) -->
    <div class="slider-group">
      <label for="speed-slider">&#8644; Speed (&#8592;&#8594;)</label>
      <div class="slider-row">
        <input type="range" id="speed-slider" min="1" max="100" step="1" value="30">
        <span class="slider-val" id="speed-display">30</span>
      </div>
    </div>

    <span id="play-status"></span>

    <div class="ctrl-sep"></div>

    <!-- Voice-follow: local speech recognition on the server moves the position -->
    <button id="voice-btn" title="Voice-follow: listen to the microphone and keep up with what you read">&#x1F3A4; Voice</button>
    <span id="voice-status"></span>

    <span id="scroll-display">position: 0%</span>
  </div>

  <div id="qr-overlay" hidden>
    <div id="qr-popup">
      <p id="qr-url">{{ mobile_url }}</p>
      <img src="{{ qr_data_uri }}" alt="QR code">
      <button id="qr-close">Close</button>
    </div>
  </div>

  <div id="editor">
    <textarea id="script" spellcheck="false" placeholder="Paste or type your script here…"></textarea>
    <div id="reading-line"></div>
  </div>
  <div id="mirror" aria-hidden="true"></div>

  <script src="/static/socket.io.min.js"></script>
  <script src="/static/textpos.js"></script>
  <script>
    const socket = io();

    let fontSize   = 36;
    let marginPct  = 15;
    let flipped    = true;
    let brightness = 25;
    let debounceTimer = null;

    const scriptEl      = document.getElementById('script');
    const mirror        = document.getElementById('mirror');
    const readingLineEl = document.getElementById('reading-line');
    const fontSlider    = document.getElementById('font-slider');
    const marginSlider  = document.getElementById('margin-slider');
    const brightSlider  = document.getElementById('bright-slider');
    const fontDisplay   = document.getElementById('font-display');
    const marginDisplay = document.getElementById('margin-display');
    const brightDisplay = document.getElementById('bright-display');
    const flipBtn       = document.getElementById('flip-btn');
    const scrollDisplay = document.getElementById('scroll-display');
    const overlay       = document.getElementById('qr-overlay');
    const playModeBtn   = document.getElementById('play-mode-btn');
    const speedSlider   = document.getElementById('speed-slider');
    const speedDisplay  = document.getElementById('speed-display');
    const playStatus    = document.getElementById('play-status');

    // ---- Shared position & reading line ----
    // pos is a (fractional) character offset: the text on the reading line, on every
    // device. Each device maps it to pixels with its own line wrapping (textpos.js).
    // A textarea can't measure character positions, so we measure a hidden mirror
    // div that has the same text, font and wrap width.
    const deskLineHeight = () => parseFloat(getComputedStyle(scriptEl).lineHeight);
    const mapper = createTextMapper(mirror, deskLineHeight);
    let pos = 0;

    const readingY = () => scriptEl.clientHeight * READING_LINE;
    const padTop   = () => parseFloat(scriptEl.style.paddingTop) || 0;

    function layoutEditor() {
      const cs = getComputedStyle(scriptEl);
      const lh = deskLineHeight();
      // Padding lets the first line reach the reading line (top) and the last line too (bottom).
      scriptEl.style.paddingTop    = (readingY() - lh / 2) + 'px';
      scriptEl.style.paddingBottom = (scriptEl.clientHeight - readingY()) + 'px';
      mirror.style.width = (scriptEl.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight)) + 'px';
      for (const prop of ['fontFamily', 'fontSize', 'fontWeight', 'lineHeight', 'letterSpacing', 'wordSpacing', 'tabSize']) {
        mirror.style[prop] = cs[prop];
      }
      // Rule just under the current line, like ruled paper (doesn't strike through text).
      readingLineEl.style.top = (readingY() + lh / 2) + 'px';
    }

    function setMirrorText() {
      mirror.textContent = scriptEl.value;
    }

    function updateScrollDisplay() {
      const n = scriptEl.value.length;
      scrollDisplay.textContent = 'position: ' + (n ? Math.round(pos / n * 100) : 0) + '%';
    }

    function setPos(p, emit) {
      pos = p;
      updateScrollDisplay();
      if (emit) socket.emit('position', { pos });
    }

    // Position currently on the editor's reading line.
    function posFromEditor() {
      return mapper.yToPos(scriptEl.scrollTop + readingY() - padTop());
    }

    // Scroll the editor so pos is on its reading line. Remembers the resulting
    // scrollTop so the scroll event this causes isn't mistaken for a user scroll.
    // (If scrollTop doesn't change there's no scroll event, so nothing to expect —
    // a stale expectation would swallow the user's next small scroll.)
    let expectedScrollTop = null;
    function scrollEditorTo(p) {
      const before = scriptEl.scrollTop;
      scriptEl.scrollTop = padTop() + mapper.posToY(p) - readingY();
      expectedScrollTop = scriptEl.scrollTop !== before ? scriptEl.scrollTop : null;
    }

    // Any user scroll of the editor (wheel, scrollbar, keyboard, caret) moves the phone.
    scriptEl.addEventListener('scroll', () => {
      if (expectedScrollTop !== null && Math.abs(scriptEl.scrollTop - expectedScrollTop) < 2) return;
      expectedScrollTop = null;
      setPos(posFromEditor(), true);
    });

    // Re-layout whenever the editor changes size — not only on window resize: the
    // control bar wraps onto more or fewer rows as its status texts change length.
    new ResizeObserver(() => {
      layoutEditor();
      scrollEditorTo(pos);
    }).observe(scriptEl);

    // Positions from elsewhere: the phone while playing (~10 Hz), voice-follow, or the
    // server's connect-time push (initial) — adopted only on first load (see State restore).
    socket.on('position', ({ pos: p, initial }) => {
      if (initial) {
        const adopting = adopt;
        adopt = false;
        if (!adopting) { pushState(); return; }
      }
      setPos(p, false);
      scrollEditorTo(p);
    });

    // Wheel: scrolls the editor (and so the phone) from anywhere on the page.
    // Speed scales with horizontal mouse position, for fine positioning:
    //   left 25% of window → 1.0 (normal),  right edge → 0.2 (5× finer)
    let mouseX = window.innerWidth / 2;
    document.addEventListener('mousemove', (e) => { mouseX = e.clientX; });
    let wheelRemainder = 0;
    document.addEventListener('wheel', (e) => {
      if (e.ctrlKey || !overlay.hidden) return;  // pinch-zoom / QR popup
      e.preventDefault();
      let dy = e.deltaY;
      if (e.deltaMode === 1) dy *= 32;
      if (e.deltaMode === 2) dy *= window.innerHeight;
      const leftZone = 0.25 * window.innerWidth;
      const scale = mouseX <= leftZone ? 1 : 1 - 0.8 * (mouseX - leftZone) / (window.innerWidth - leftZone);
      wheelRemainder += dy * scale;
      const step = Math.trunc(wheelRemainder);  // keep sub-pixel amounts for touchpads
      wheelRemainder -= step;
      scriptEl.scrollTop += step;
    }, { passive: false });

    // Click on a line (without dragging a selection) → put that line on the reading line.
    scriptEl.addEventListener('click', () => {
      if (scriptEl.selectionStart !== scriptEl.selectionEnd) return;
      const p = mapper.lineStart(scriptEl.selectionStart);
      setPos(p, true);
      scrollEditorTo(p);
    });

    // ---- Play mode ----
    // The phone runs the auto-scroll itself; we send it commands and follow its
    // position reports. Speed is px/s on the phone.
    let playMode  = false;
    let playing   = false;
    let playSpeed = 30;

    function sendPlay(action, extra = {}) {
      socket.emit('play_control', { action, speed: playSpeed, ...extra });
    }

    function setPlaying(on) {
      playing = on;
      playStatus.textContent = on ? '▶ playing' : '⏸ paused';
      playStatus.className   = on ? 'playing'   : 'paused';
    }

    function setSpeed(v) {
      playSpeed = Math.max(1, Math.min(100, v));
      speedSlider.value = playSpeed;
      speedDisplay.textContent = playSpeed;
    }

    playModeBtn.addEventListener('click', () => {
      playMode = !playMode;
      playModeBtn.textContent = playMode ? '⏹ Stop' : '▶ Play';
      playModeBtn.classList.toggle('active', playMode);
      // Read-only in play mode so arrow keys drive the prompter rather than the caret.
      scriptEl.readOnly = playMode;
      playModeBtn.blur();
      sendPlay('pause');
      setPlaying(false);
      if (!playMode) {
        playStatus.textContent = '';
        playStatus.className   = '';
      }
    });

    speedSlider.addEventListener('input', () => {
      setSpeed(parseInt(speedSlider.value));
      sendPlay('speed');
    });

    socket.on('play_control', (d) => setSpeed(d.speed));  // speed as stored on the server
    socket.on('play_state', ({ playing: on }) => { if (playMode) setPlaying(on); });

    // ---- Voice-follow ----
    // Speech recognition runs in the server (voice.py); matches arrive as ordinary
    // position events. Here we just toggle it and show what it hears.
    const voiceBtn    = document.getElementById('voice-btn');
    const voiceStatus = document.getElementById('voice-status');
    let voiceOn = false;

    voiceBtn.addEventListener('click', () => {
      voiceBtn.blur();
      socket.emit('voice_toggle', { on: !voiceOn });
    });

    socket.on('voice_status', ({ state, heard, error }) => {
      voiceOn = state === 'loading' || state === 'listening';
      voiceBtn.classList.toggle('active', voiceOn);
      voiceStatus.className = state === 'error' ? 'error' : '';
      voiceStatus.textContent =
        state === 'error'     ? 'voice: ' + error :
        state === 'listening' ? (heard || 'listening…') :
        state === 'loading'   ? heard : '';
      voiceStatus.title = voiceStatus.textContent;
    });

    // Text sync (debounced). The editor is the reference for position while editing.
    scriptEl.addEventListener('input', () => {
      setMirrorText();
      updateFileStatus();
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => {
        socket.emit('text_update', { text: scriptEl.value });
        setPos(posFromEditor(), true);
      }, 300);
    });

    // Save to the script file given on the server's command line (if any).
    // savedText is the file's content as last loaded/saved, for the unsaved-changes marker.
    const saveBtn    = document.getElementById('save-btn');
    const fileStatus = document.getElementById('file-status');
    let fileName  = null;
    let savedText = '';

    function updateFileStatus() {
      if (!fileName) { fileStatus.textContent = ''; return; }
      const dirty = scriptEl.value !== savedText;
      fileStatus.textContent = (dirty ? '● ' : '') + fileName;
      fileStatus.title       = dirty ? 'Unsaved changes (Ctrl+S to save)' : 'Saved';
      fileStatus.className   = dirty ? 'dirty' : '';
    }

    function saveScript() {
      if (!fileName) return;
      clearTimeout(debounceTimer);  // the save carries the latest text itself
      socket.emit('save_script', { text: scriptEl.value });
      fileStatus.textContent = 'saving…';
    }

    socket.on('file_info', ({ name, savedText: s }) => {
      // First of the server's connect-time pushes: decide whether to adopt its state.
      adopt = firstConnect || (name !== null && (name !== fileName || scriptEl.value === savedText));
      firstConnect = false;
      fileName  = name;
      savedText = s;
      saveBtn.hidden   = !name;
      reloadBtn.hidden = !name;
      updateFileStatus();
    });

    socket.on('save_result', (r) => {
      if (r.ok) {
        savedText = r.savedText;
        updateFileStatus();
      } else {
        fileStatus.textContent = 'save failed: ' + r.error;
        fileStatus.title       = r.error;
        fileStatus.className   = 'error';
      }
    });

    saveBtn.addEventListener('click', () => {
      saveScript();
      saveBtn.blur();  // so Space/Enter later don't re-trigger it
    });

    // Reload from disk — picks up edits made in another editor.
    const reloadBtn = document.getElementById('reload-btn');
    reloadBtn.addEventListener('click', () => {
      reloadBtn.blur();
      if (scriptEl.value !== savedText &&
          !confirm('Discard your unsaved edits and reload ' + fileName + ' from disk?')) return;
      clearTimeout(debounceTimer);  // don't let a pending text_update overwrite the reload
      socket.emit('reload_script');
      fileStatus.textContent = 'reloading…';
    });

    socket.on('reload_result', (r) => {
      if (r.ok) {
        scriptEl.value = r.savedText;
        savedText      = r.savedText;
        setMirrorText();
        updateFileStatus();
        // The phone has the new text already (the server sends it first); re-sync position.
        setPos(Math.min(pos, scriptEl.value.length), true);
        scrollEditorTo(pos);
      } else {
        fileStatus.textContent = 'reload failed: ' + r.error;
        fileStatus.title       = r.error;
        fileStatus.className   = 'error';
      }
    });

    // Sliders
    fontSlider.addEventListener('input', () => {
      fontSize = parseInt(fontSlider.value);
      fontDisplay.textContent = fontSize + 'px';
      emitSettings();
    });

    marginSlider.addEventListener('input', () => {
      marginPct = parseInt(marginSlider.value);
      marginDisplay.textContent = marginPct + '%';
      emitSettings();
    });

    brightSlider.addEventListener('input', () => {
      brightness = parseInt(brightSlider.value);
      brightDisplay.textContent = brightness + '%';
      emitSettings();
    });

    // Flip
    flipBtn.addEventListener('click', () => {
      flipped = !flipped;
      flipBtn.classList.toggle('active', flipped);
      emitSettings();
    });

    function emitSettings() {
      socket.emit('settings_update', { fontSize, marginPct, flipped, brightness });
    }

    // State restore. The server pushes full state on every connect, starting with
    // file_info and ending with an `initial` position. file_info sets `adopt`:
    //   first connect of this page (e.g. after a reload) → adopt the server's state;
    //   reconnect (server restarted) with a file loaded that is a different file, or that
    //     we have no unsaved edits to → adopt it too (the server's copy is the current one);
    //   otherwise (no file, so the server's state is blank; or unsaved edits to the same
    //     file) → ignore it and push ours back when the `initial` position arrives.
    // Later text/settings broadcasts (another desktop saving, say) are ignored.
    // (Don't use the socket's 'connect' event for this: the server's pushes can arrive
    // before it fires.)
    let firstConnect = true;
    let adopt = false;

    function pushState() {
      socket.emit('text_update', { text: scriptEl.value });
      emitSettings();
      setPos(pos, true);
    }

    socket.on('text_broadcast', ({ text }) => {
      if (!adopt) return;
      scriptEl.value = text;
      setMirrorText();
      updateFileStatus();
    });

    socket.on('settings_broadcast', (s) => {
      if (!adopt) return;
      fontSize   = s.fontSize;   fontSlider.value   = fontSize;   fontDisplay.textContent   = fontSize + 'px';
      marginPct  = s.marginPct;  marginSlider.value = marginPct;  marginDisplay.textContent = marginPct + '%';
      brightness = s.brightness; brightSlider.value = brightness; brightDisplay.textContent = brightness + '%';
      flipped    = s.flipped;    flipBtn.classList.toggle('active', flipped);
    });

    // QR popup
    document.getElementById('qr-btn').addEventListener('click', () => {
      overlay.removeAttribute('hidden');
    });
    document.getElementById('qr-close').addEventListener('click', () => {
      overlay.setAttribute('hidden', '');
    });
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) overlay.setAttribute('hidden', '');
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') overlay.setAttribute('hidden', '');

      // Ctrl+S / Cmd+S saves to the script file (instead of the browser's "Save page").
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's' && fileName) {
        e.preventDefault();
        saveScript();
        return;
      }

      // Arrow keys only active in play mode (textarea is read-only then, so it's safe
      // to take them even when it has focus — e.g. after click-to-seek).
      if (!playMode) return;

      switch (e.key) {
        case 'ArrowLeft':
          e.preventDefault();
          setSpeed(playSpeed - 5);
          sendPlay('speed');
          break;

        case 'ArrowRight':
          e.preventDefault();
          setSpeed(playSpeed + 5);
          sendPlay('speed');
          break;

        case 'ArrowDown':
          e.preventDefault();
          if (!playing) {
            setPlaying(true);
            sendPlay('play');
          } else {
            sendPlay('skip', { seconds: 2 });   // skip forward ~2 s of movement
          }
          break;

        case 'ArrowUp':
          e.preventDefault();
          if (playing) {
            setPlaying(false);                  // first press: pause only
            sendPlay('pause');
          } else {
            sendPlay('skip', { seconds: -6 });  // already paused: back ~6 s
          }
          break;
      }
    });

    layoutEditor();
    updateScrollDisplay();
  </script>
</body>
</html>
