<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>LocalCue</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #000;
    }

    #hint {
      position: fixed;
      bottom: 16px;
      right: 16px;
      color: rgba(255,255,255,0.4);
      font-size: 13px;
      pointer-events: none;
      transition: opacity 1s ease;
    }

    #wake-indicator {
      position: fixed;
      top: 10px;
      right: 10px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #444;   /* grey = unknown / not acquired */
      pointer-events: none;
      transition: background 0.4s;
    }
    #wake-indicator.active   { background: #48f; }  /* blue  = lock held */
    #wake-indicator.inactive { background: #f44; }  /* red   = API failed / released */

    #display {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;

      transform: scaleX(-1); /* mirror by default */

      padding: 20px 15%;
      font-size: 36px;
      font-family: Georgia, serif;
      color: rgba(255,255,255,0.25);
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* Reading line: positioned by JS, one third of the way down */
    #reading-line {
      position: fixed;
      left: 0;
      right: 0;
      height: 2px;
      background: rgba(255, 70, 70, 0.45);
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="display"></div>
  <div id="reading-line"></div>
  <div id="hint">tap for fullscreen</div>
  <div id="wake-indicator" title="Wake lock status"></div>

  <script src="/static/socket.io.min.js"></script>
  <script src="/static/textpos.js"></script>
  <script>
    const socket = io();
    const display = document.getElementById('display');
    const readingLine = document.getElementById('reading-line');

    let currentFontSize = 36;
    const lineHeight = () => currentFontSize * 1.7;
    const mapper = createTextMapper(display, lineHeight);

    // pos = shared script position (chars); y = where that is within #display (px).
    // The text is placed so y sits on the reading line.
    let pos = 0;
    let y = 0;

    function readingY() { return window.innerHeight * READING_LINE; }

    function render() {
      display.style.top = (readingY() - y) + 'px';
      // Rule just under the current line, like ruled paper (doesn't strike through text).
      readingLine.style.top = (readingY() + lineHeight() / 2) + 'px';
    }

    function goToPos(p) {
      pos = p;
      y = mapper.posToY(pos);
      glideTarget = null;
      render();
    }

    // Glide: voice-follow positions arrive in small steps; ease towards each
    // one (~0.3 s time constant) rather than jumping, so the text moves smoothly.
    let glideTarget = null;
    let glideLast = null;

    function glideTo(p) {
      pos = p;
      const starting = glideTarget === null;
      glideTarget = mapper.posToY(p);
      if (starting) { glideLast = null; requestAnimationFrame(glideFrame); }
    }

    function glideFrame(t) {
      if (glideTarget === null) return;
      const dt = glideLast === null ? 16 : Math.min(t - glideLast, 100);
      glideLast = t;
      y += (glideTarget - y) * (1 - Math.exp(-dt / 300));
      if (Math.abs(glideTarget - y) < 0.5) {
        y = glideTarget;
        glideTarget = null;
      }
      render();
      if (glideTarget !== null) requestAnimationFrame(glideFrame);
    }

    function reportPos() {
      pos = mapper.yToPos(y);
      socket.emit('position', { pos });
    }

    // Auto-scroll runs here on the phone (smooth, no network jitter); the desktop
    // sends play/pause/skip/speed and follows the ~10 Hz position reports.
    let playing = false;
    let speed = 30;  // px/s
    let lastFrame = null;
    let lastReport = 0;

    function endY() { return mapper.posToY(mapper.length()); }

    function frame(t) {
      if (!playing) { lastFrame = null; return; }
      if (lastFrame !== null) {
        const dt = Math.min(t - lastFrame, 100) / 1000;  // cap to avoid jumps after a stall
        const yEnd = endY();
        y = Math.min(yEnd, y + speed * dt);
        render();
        if (y >= yEnd) {  // reached the end of the script
          playing = false;
          reportPos();
          socket.emit('play_state', { playing: false });
          return;
        }
        if (t - lastReport >= 100) {
          reportPos();
          lastReport = t;
        }
      }
      lastFrame = t;
      requestAnimationFrame(frame);
    }

    socket.on('play_control', (d) => {
      speed = d.speed ?? speed;
      switch (d.action) {
        case 'play':
          if (!playing) { playing = true; requestAnimationFrame(frame); }
          break;
        case 'pause':
          if (playing) { playing = false; reportPos(); }
          break;
        case 'skip':
          y = Math.max(0, Math.min(endY(), y + speed * d.seconds));
          render();
          reportPos();
          break;
      }
    });

    // Jump (and keep playing, if playing) — or glide, for voice-follow.
    socket.on('position', ({ pos: p, glide }) => glide ? glideTo(p) : goToPos(p));

    socket.on('text_broadcast', ({ text }) => {
      display.textContent = text;
      goToPos(Math.min(pos, text.length));
    });

    socket.on('settings_broadcast', ({ fontSize, marginPct, flipped, brightness }) => {
      currentFontSize = fontSize;
      display.style.fontSize = fontSize + 'px';
      display.style.padding = `20px ${marginPct}%`;
      display.style.transform = flipped ? 'scaleX(-1)' : 'none';
      display.style.color = `rgba(255, 255, 255, ${brightness / 100})`;
      goToPos(pos);  // re-wrapped, so recompute where pos is
    });

    // Viewport changes (fullscreen, rotation, browser chrome) move the reading line.
    window.addEventListener('resize', () => goToPos(pos));

    // Wake lock — keeps screen on during use.
    // The API releases the lock whenever the page is hidden, so we re-request
    // on every visibilitychange back to visible and on a 30 s heartbeat.
    let wakeLock = null;
    const wakeIndicator = document.getElementById('wake-indicator');

    function setWakeIndicator(state) {  // 'active' | 'inactive' | ''
      wakeIndicator.className = state;
    }

    async function requestWakeLock() {
      if (!('wakeLock' in navigator)) {
        setWakeIndicator('inactive');
        return;
      }
      try {
        wakeLock = await navigator.wakeLock.request('screen');
        setWakeIndicator('active');
        wakeLock.addEventListener('release', () => {
          wakeLock = null;
          setWakeIndicator('inactive');
        });
      } catch (err) {
        console.warn('Wake lock failed:', err.name, err.message);
        setWakeIndicator('inactive');
      }
    }

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') requestWakeLock();
    });

    // Belt-and-suspenders: re-request every 30 s in case the OS released it quietly.
    setInterval(() => {
      if (document.visibilityState === 'visible' && !wakeLock) requestWakeLock();
    }, 30_000);

    // Tap anywhere to toggle fullscreen, and (re-)acquire wake lock on entry.
    document.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
        requestWakeLock();
      } else {
        document.exitFullscreen().catch(() => {});
      }
    });

    // Fade out the hint after 3 seconds
    const hint = document.getElementById('hint');
    setTimeout(() => { hint.style.opacity = '0'; }, 3000);
    setTimeout(() => { hint.style.display = 'none'; }, 4000);

    // Initial wake lock request on page load
    requestWakeLock();
  </script>
</body>
</html>
